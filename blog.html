<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog — Eileen Lai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500&family=DM+Mono&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />

    <style>
        .blog-content {
            max-width: 580px;
            width: 100%;
        }

        .post-list {
            display: flex;
            flex-direction: column;
        }

        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1.5rem;
            padding: 1.25rem 0;
            border-bottom: 1px solid #f0e4e2;
            text-decoration: none;
            color: inherit;
            transition: all 0.15s;
        }

        .post-item:first-child {
            border-top: 1px solid #f0e4e2;
        }

        .post-item:hover .post-title {
            color: #cc8895;
        }

        .post-item:hover .post-arrow {
            opacity: 1;
            transform: translateX(3px);
        }

        .post-left {
            flex: 1;
        }

        .post-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            margin-bottom: 0.3rem;
            transition: color 0.15s;
        }

        .post-excerpt {
            font-size: 0.875rem;
            color: #a09090;
            line-height: 1.6;
        }

        .post-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .post-date {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: #ccc;
            letter-spacing: 0.04em;
        }

        .post-arrow {
            font-size: 0.875rem;
            color: #cc8895;
            opacity: 0;
            transition: all 0.15s;
        }

        .tag-list {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
            margin-top: 0.4rem;
        }

        .tag {
            font-family: 'DM Mono', monospace;
            font-size: 0.62rem;
            color: #a09090;
            background: #f7eeef;
            border: 1px solid #eed8da;
            border-radius: 4px;
            padding: 0.15rem 0.45rem;
            letter-spacing: 0.03em;
        }

        /* dark mode */
        html.dark .post-item {
            border-color: #2c2c2a;
        }

        html.dark .post-title {
            color: #f0e8e0;
        }

        html.dark .post-excerpt {
            color: #7a6e6a;
        }

        html.dark .post-date {
            color: #4a4a48;
        }

        html.dark .post-item:hover .post-title {
            color: #d4949f;
        }

        html.dark .tag {
            background: transparent;
            border-color: #3c3c3a;
            color: #7a6e6a;
        }

        @media (max-width: 640px) {
            .post-item {
                flex-direction: column;
                gap: 0.5rem;
            }

            .post-right {
                justify-content: flex-start;
            }

            .post-arrow {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="cursor" id="cursor"></div>

    <nav class="nav">
        <a href="index.html" class="nav-logo">Eileen Lai</a>
        <div class="nav-links">
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="blog.html" class="active">Blog</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">☽</button>
        </div>
    </nav>

    <div class="page-content">
        <div class="blog-content">
            <h1>Blog</h1>

            <div class="post-list">

                <!-- Add new posts here by copying this block -->
                <a href="blog/freshman-year.html" class="post-item">
                    <div class="post-left">
                        <div class="post-title">Freshman Year @ CMU</div>
                        <div class="post-excerpt">As I write this three months after I finished my first year, I
                            realized I forgot most of what happened oops</div>
                        <div class="tag-list">
                            <span class="tag">school</span>
                            <span class="tag">reflection</span>
                        </div>
                    </div>
                    <div class="post-right">
                        <span class="post-date">Aug 2026</span>
                        <span class="post-arrow">→</span>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-left">Thanks for stopping by!</div>
        <div class="footer-right">
            <a href="mailto:eileenlai@cmu.edu">Email</a>
            <a href="https://linkedin.com/in/laieileen" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://github.com/laieileen" target="_blank" rel="noopener noreferrer">Github</a>
        </div>
    </footer>

    <script>
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseover', e => {
            if (e.target.closest('a, button')) cursor.classList.add('hovering');
        });
        document.addEventListener('mouseout', e => {
            if (e.target.closest('a, button')) cursor.classList.remove('hovering');
        });

        const toggle = document.getElementById('themeToggle');
        const root = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') {
            root.classList.add('dark');
            toggle.textContent = '☀︎';
        }
        toggle.addEventListener('click', () => {
            const isDark = root.classList.toggle('dark');
            toggle.textContent = isDark ? '☀︎' : '☽';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>

</body>

</html>
