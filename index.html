<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eileen Lai</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500&family=DM+Mono&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />

    <style>
        .home-content {
            max-width: 800px;
            width: 100%;
            display: flex;
            align-items: flex-start;
            gap: 3rem;
            margin: auto;
        }

        .home-text {
            flex: 1;
        }

        .bio {
            font-size: 1rem;
            color: #666;
            line-height: 1.8;
            margin-top: 0.5rem;
        }

        @media (max-width: 640px) {
            .home-content {
                flex-direction: column;
                gap: 2rem;
            }
        }
    </style>
</head>

<body>

    <div class="cursor" id="cursor"></div>

    <nav class="nav">
        <a href="index.html" class="nav-logo">Eileen Lai</a>
        <div class="nav-links">
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="blog.html">Blog</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">☽</button>
        </div>
    </nav>

    <div class="page-content">
        <div class="home-content">
            <div class="home-text">
                <h1>Eileen Lai</h1>
                <p class="bio">I'm currently studying CS at Carnegie Mellon University.</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-left">Thanks for stopping by!</div>
        <div class="footer-right">
            <a href="mailto:eileenlai@cmu.edu">Email</a>
            <a href="https://linkedin.com/in/laieileen" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://github.com/laieileen" target="_blank" rel="noopener noreferrer">Github</a>
        </div>
    </footer>

    <script>
        // ── Custom cursor ──
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseover', e => {
            if (e.target.closest('a, button')) cursor.classList.add('hovering');
        });
        document.addEventListener('mouseout', e => {
            if (e.target.closest('a, button')) cursor.classList.remove('hovering');
        });

        // ── Dark mode toggle ──
        const toggle = document.getElementById('themeToggle');
        const root = document.documentElement;

        if (localStorage.getItem('theme') === 'dark') {
            root.classList.add('dark');
            toggle.textContent = '☀︎';
        }

        toggle.addEventListener('click', () => {
            const isDark = root.classList.toggle('dark');
            toggle.textContent = isDark ? '☀︎' : '☽';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>

</body>

</html>
